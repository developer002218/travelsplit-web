<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelSplit - Trip Invitation</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-purple: #6366f1;
            --accent-purple-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --cyan-glow: #38bdf8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--cyan-glow);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: var(--text-main);
            font-weight: 700;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .code-box {
            background: var(--bg-color);
            color: var(--cyan-glow);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            padding: 16px;
            margin: 0 auto 24px auto;
            border-radius: 14px;
            border: 1px dashed #475569;
            display: inline-block;
            width: 80%;
        }
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, opacity 0.2s;
            margin-bottom: 12px;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-badge">
            ⚡ TravelSplit Invitation
        </div>
        
        <h1 id="titleText">You're Invited to a Trip!</h1>
        <p id="descText">Join this expense-sharing group to collaborate and split bills effortlessly.</p>
        
        <div class="code-box" id="tripCodeDisplay">-----</div>
        
        <!-- Primary Download Button (For users without the app) -->
        <a href="https://github.com/developer002218/travelsplit-web/releases/latest" id="downloadBtn" class="btn-primary">
            📥 Download Android APK (v1.1.2)
        </a>

        <!-- Secondary Action: Try opening app if installed -->
        <a href="#" id="openAppBtn" class="btn-secondary" style="display:none;">
            Open in TravelSplit App
        </a>
        
        <div class="footer-note">
            Native Android • Real-time Sync • Secure
        </div>
    </div>

    <script>
        // GitHub Pages 404 redirection ke case mein URL path ko query parameter ya path se nikalna
        // Jaise agar GitHub ne 404 ke zariye bheja hai ya direct path hai:
        let pathname = window.location.pathname;
        
        // Agar GitHub Pages single-page redirect trick use ho rahi hai ya standard path match hai
        let match = pathname.match(/\/join\/([A-Za-z0-9]{5})/);
        
        // Fallback: Agar URL query string mein code ho (e.g. ?code=EHA7Y)
        if (!match) {
            const urlParams = new URLSearchParams(window.location.search);
            const queryCode = urlParams.get('code');
            if (queryCode && queryCode.length === 5) {
                match = [null, queryCode];
            }
        }

        if (match) {
            const tripCode = match[1];
            document.getElementById('tripCodeDisplay').innerText = tripCode;
            
            // Fallback ke taur par query param wala URL bhi support kare
            const customIntentUri = `intent://travelsplit.app/join/${tripCode}#Intent;scheme=https;package=com.aistudio.travelsplit.app;end;`;
            
            const openAppBtn = document.getElementById('openAppBtn');
            openAppBtn.href = customIntentUri;
            openAppBtn.style.display = "flex";

            // Automatic intent launch attempt browser se app kholne ke liye
            setTimeout(function() {
                window.location.replace(customIntentUri);
            }, 500);
            
        } else {
            // Agar koi code nahi mila toh standard error / fallback state
            document.getElementById('tripCodeDisplay').innerText = "ERROR";
            document.getElementById('titleText').innerText = "Invalid Invitation Link";
            document.getElementById('descText').innerText = "The trip code provided in the link is invalid or incomplete.";
            document.getElementById('openAppBtn').style.display = "none";
        }
    </script>
</body>
</html>
