<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelSplit - Trip Invitation</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            max-width: 450px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .code-box {
            background: #0f172a;
            color: #38bdf8;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 12px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px dashed #475569;
        }
        .btn {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ TravelSplit Invitation</h2>
        <p>You have been invited to join an expense-sharing group on TravelSplit.</p>
        
        <div class="code-box" id="tripCodeDisplay">Loading...</div>
        
        <p id="statusText">Attempting to open the app automatically...</p>
        
        <a href="#" id="manualBtn" class="btn" style="display:none;">Open in TravelSplit App</a>
        
        <p style="margin-top: 25px; font-size: 12px;">
            Don't have the app installed? <br>
            <a href="https://github.com/yoodhasports/TravelSplit/releases" style="color: #38bdf8;">Download Latest APK from GitHub</a>
        </p>
    </div>

    <script>
        // URL Path se 5-character trip code nikalna (e.g., /join/K9X2M)
        const path = window.location.pathname;
        const match = path.match(/\/join\/([A-Za-z0-9]{5})/);
        
        if (match) {
            const tripCode = match[1];
            document.getElementById('tripCodeDisplay').innerText = tripCode;
            
            // Custom Android Intent Trigger
            const customIntentUri = `travelsplit://join/${tripCode}`;
            
            // Redirecting user to app
            window.location.href = customIntentUri;
            
            // Fallback message agar app khulne me time le ya installed na ho
            setTimeout(() => {
                document.getElementById('statusText').innerText = "If the app didn't open automatically, tap the button below:";
                const manualBtn = document.getElementById('manualBtn');
                manualBtn.href = customIntentUri;
                manualBtn.style.display = "inline-block";
            }, 1500);
            
        } else {
            document.getElementById('tripCodeDisplay').innerText = "INVALID";
            document.getElementById('statusText').innerText = "This invitation link is invalid or incomplete.";
        }
    </script>
</body>
</html>
