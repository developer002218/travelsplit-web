<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Trip - TravelSplit</title>
    <!-- Google Fonts & Tailwind CSS for modern look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }
        .glow-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.7)விட்டு, rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6">

    <!-- Top Branding -->
    <div class="w-full max-w-md text-center pt-8">
        <div class="inline-flex items-center gap-2 bg-indigo-950/60 border border-indigo-500/30 px-3 py-1 rounded-full text-xs text-indigo-300 mb-4">
            ⚡ TravelSplit Invitation
        </div>
        <h1 class="text-2xl font-bold tracking-tight">TravelSplit</h1>
    </div>

    <!-- Main Card container -->
    <div class="w-full max-w-md glow-card rounded-2xl p-6 shadow-2xl text-center my-auto">
        <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/40 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
            ✈️
        </div>
        
        <h2 class="text-xl font-semibold mb-2">You're Invited to a Trip!</h2>
        <p class="text-gray-400 text-sm mb-6">You have been invited to join an expense-sharing group on TravelSplit.</p>

        <!-- Dynamic Trip Code Box -->
        <div id="code-box" class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-4 mb-6 hidden">
            <span class="text-xs text-gray-400 block mb-1">TRIP CODE</span>
            <span id="trip-code-display" class="text-2xl font-mono font-bold text-indigo-400 tracking-wider">-----</span>
        </div>

        <!-- Download Action Button -->
        <a id="download-btn" href="#" class="btn-gradient w-full py-3.5 px-6 rounded-xl font-medium text-white shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition hover:opacity-90 mb-4">
            📥 Download Android APK (v1.1.1)
        </a>

        <p class="text-xs text-gray-500">
            Already have the app? <a href="#" id="open-app-link" class="text-indigo-400 underline">Open in TravelSplit</a>
        </p>
    </div>

    <!-- Footer -->
    <div class="w-full max-w-md text-center text-xs text-gray-600 pb-4">
        © 2026 TravelSplit. All rights reserved.
    </div>

    <!-- JavaScript to extract code from URL -->
    <script>
        // Extract code from URL path like /join/K9X2M
        const pathSegments = window.location.pathname.split('/');
        const joinIndex = pathSegments.indexOf('join');
        let tripCode = '';

        if (joinIndex !== -1 && pathSegments[joinIndex + 1]) {
            tripCode = pathSegments[joinIndex + 1].toUpperCase();
        } else {
            // Fallback for query parameters if any (?code=K9X2M)
            const urlParams = new URLSearchParams(window.location.search);
            tripCode = urlParams.get('code') || '';
        }

        if (tripCode) {
            document.getElementById('trip-code-display').innerText = tripCode;
            document.getElementById('code-box').classList.remove('hidden');
            
            // Optional: Try opening app via custom scheme if installed
            document.getElementById('open-app-link').href = `travelsplit://join/${tripCode}`;
        } else {
            document.getElementById('trip-code-display').parentElement.innerHTML = '<span class="text-sm text-gray-400">Open this link via your app invite or QR code.</span>';
            document.getElementById('code-box').classList.remove('hidden');
        }

        // TODO: Replace with your actual GitHub APK release URL
        document.getElementById('download-btn').href = "https://github.com/YOUR_USERNAME/YOUR_REPO/releases/latest/download/app-debug.apk";
    </script>
</body>
</html>
